<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 700px; margin: auto; }
    h1 { text-align: center; margin-bottom: 20px; color: #333; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-danger  { background: #dc2626; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 13px; }
    #msg { text-align: center; margin-bottom: 10px; color: #dc2626; }
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .task-item:last-child { border-bottom: none; }
    .task-title.done { text-decoration: line-through; color: #888; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    #auth-section, #app-section { display: none; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 8px 20px; border-radius: 4px; cursor: pointer; background: #e5e7eb; }
    .tab.active { background: #4f46e5; color: #fff; }
  </style>
</head>
<body>
<div class="container">
  <h1>Task Manager</h1>
  <p id="msg"></p>

  <!-- Auth Section -->
  <div id="auth-section" class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <div id="login-form">
      <input id="login-user" placeholder="Username" />
      <input id="login-pass" type="password" placeholder="Password" />
      <button class="btn-primary" onclick="login()">Login</button>
    </div>

    <div id="register-form" style="display:none">
      <input id="reg-user" placeholder="Username" />
      <input id="reg-email" placeholder="Email" />
      <input id="reg-pass" type="password" placeholder="Password" />
      <button class="btn-primary" onclick="register()">Register</button>
    </div>
  </div>

  <!-- App Section -->
  <div id="app-section">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <span id="welcome-msg"></span>
      <button class="btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px">Create Task</h3>
      <input id="task-title" placeholder="Title" />
      <textarea id="task-desc" placeholder="Description" rows="2"></textarea>
      <button class="btn-primary" onclick="createTask()">Add Task</button>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3>My Tasks</h3>
        <div class="filter-bar">
          <button class="btn-sm btn-primary" onclick="loadTasks(null)">All</button>
          <button class="btn-sm btn-success" onclick="loadTasks(true)">Completed</button>
          <button class="btn-sm" style="background:#f59e0b;color:#fff" onclick="loadTasks(false)">Pending</button>
        </div>
      </div>
      <div id="task-list"></div>
    </div>
  </div>
</div>

<script>
  const API = "";  // same origin; change to full URL if hosted separately

  let token = localStorage.getItem("token") || null;

  function showMsg(text, color = "#dc2626") {
    const el = document.getElementById("msg");
    el.style.color = color;
    el.textContent = text;
    setTimeout(() => el.textContent = "", 3000);
  }

  function init() {
    if (token) {
      document.getElementById("auth-section").style.display = "none";
      document.getElementById("app-section").style.display = "block";
      const user = JSON.parse(atob(token.split(".")[1]));
      document.getElementById("welcome-msg").textContent = `Welcome, ${user.sub}`;
      loadTasks(null);
    } else {
      document.getElementById("auth-section").style.display = "block";
      document.getElementById("app-section").style.display = "none";
    }
  }

  function switchTab(tab) {
    document.getElementById("login-form").style.display = tab === "login" ? "block" : "none";
    document.getElementById("register-form").style.display = tab === "register" ? "block" : "none";
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("active", (tab === "login" && i === 0) || (tab === "register" && i === 1));
    });
  }

  async function register() {
    const body = {
      username: document.getElementById("reg-user").value,
      email: document.getElementById("reg-email").value,
      password: document.getElementById("reg-pass").value
    };
    const res = await fetch(`${API}/register`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (res.ok) { showMsg("Registered! Please login.", "#16a34a"); switchTab("login"); }
    else showMsg(data.detail || "Registration failed");
  }

  async function login() {
    const body = {
      username: document.getElementById("login-user").value,
      password: document.getElementById("login-pass").value
    };
    const res = await fetch(`${API}/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (res.ok) { token = data.access_token; localStorage.setItem("token", token); init(); }
    else showMsg(data.detail || "Login failed");
  }

  function logout() {
    token = null;
    localStorage.removeItem("token");
    init();
  }

  async function loadTasks(completed) {
    let url = `${API}/tasks/?limit=100`;
    if (completed !== null && completed !== undefined) url += `&completed=${completed}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { showMsg("Session expired. Please login again."); logout(); return; }
    const tasks = await res.json();
    renderTasks(tasks);
  }

  function renderTasks(tasks) {
    const list = document.getElementById("task-list");
    if (!tasks.length) { list.innerHTML = "<p style='color:#888'>No tasks found.</p>"; return; }
    list.innerHTML = tasks.map(t => `
      <div class="task-item">
        <div>
          <span class="task-title ${t.completed ? 'done' : ''}">${t.title}</span>
          <div style="font-size:13px;color:#666">${t.description}</div>
        </div>
        <div style="display:flex;gap:6px">
          ${!t.completed ? `<button class="btn-sm btn-success" onclick="completeTask(${t.id})">✓ Done</button>` : ""}
          <button class="btn-sm btn-danger" onclick="deleteTask(${t.id})">Delete</button>
        </div>
      </div>`).join("");
  }

  async function createTask() {
    const title = document.getElementById("task-title").value.trim();
    const description = document.getElementById("task-desc").value.trim();
    if (!title) { showMsg("Title is required"); return; }
    const res = await fetch(`${API}/tasks/`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ title, description })
    });
    if (res.ok) {
      document.getElementById("task-title").value = "";
      document.getElementById("task-desc").value = "";
      showMsg("Task created!", "#16a34a");
      loadTasks(null);
    } else {
      const data = await res.json();
      showMsg(data.detail || "Failed to create task");
    }
  }

  async function completeTask(id) {
    const res = await fetch(`${API}/tasks/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ completed: true })
    });
    if (res.ok) loadTasks(null);
  }

  async function deleteTask(id) {
    const res = await fetch(`${API}/tasks/${id}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.ok) loadTasks(null);
  }

  init();
</script>
</body>
</html>
